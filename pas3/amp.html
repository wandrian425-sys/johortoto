/* ======================================================
   4. KEYFRAMES ANIMASI (Menggunakan Variabel)
   ====================================================== */
@keyframes shine {
  0% { left: -150%; background-position: 0% center; }
  30% { left: 150%; }
  100% { left: 150%; background-position: 200% center; }
}

@keyframes shineMove {
  0% { transform: translateX(-100%) rotate(25deg); }
  100% { transform: translateX(100%) rotate(25deg); }
}

@keyframes goldPulse {
  0%, 100% { box-shadow: 0 0 10px var(--c-glow-accent); }
  50% { box-shadow: 0 0 25px var(--c-glow-accent-strong); }
}

@keyframes ratingPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 5px var(--c-main); }
  50% { opacity: 0.6; box-shadow: 0 0 15px var(--c-main); }
}

@keyframes goldFlow {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

@keyframes buttonPulse {
  0% { transform: scale(1); box-shadow: 0 0 10px var(--c-glow-accent); }
  50% { transform: scale(1.03); box-shadow: 0 0 25px var(--c-glow-accent-strong); }
  100% { transform: scale(1); box-shadow: 0 0 10px var(--c-glow-accent); }
}

/* ======================================================

.splash-screen {

}

@keyframes fadeOutSplash {
  0% { opacity: 1; visibility: visible; }
  99% { opacity: 0; visibility: visible; }
  100% { opacity: 0; visibility: hidden; display: none; }
}

@keyframes scaleUp {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@media (max-width: 480px) {

  .card-footer { padding-right: 40px; }
}
