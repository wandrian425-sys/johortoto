    /* Frame Utama Card 3D Running Light */
    .combo-block {

      padding: 2px;
      background: linear-gradient(135deg, var(--c-red), var(--c-white), var(--c-dark-red), var(--c-white));
      background-size: 300% 300%;
      animation: borderMove 4s ease infinite;
      box-shadow: 0 12px 35px rgba(0,0,0,0.9), 0 0 25px rgba(255, 0, 0, 0.4);
    }

    @keyframes borderMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .combo-inner {

    .btn {

      overflow: hidden;

    .btn::before {

      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;

    .block::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(90deg, var(--c-red), var(--c-white), var(--c-red));
      background-size: 300%;
      z-index: -1;
      border-radius: calc(var(--r-card) + 2px);
      opacity: 0.35;
      animation: steam 5s linear infinite;
    }

    .block::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: skewX(-25deg);
      animation: lightSweep 4s ease-in-out infinite;
    }

    @keyframes lightSweep {
      0%, 50% { left: -100%; }
      70%, 100% { left: 200%; }
    }

    .block:hover, .block:active {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--c-white);
      background: linear-gradient(135deg, rgba(180, 0, 0, 0.95) 0%, rgba(50, 0, 0, 0.95) 100%);

    #bottom-navbar ul li a:hover {

    @keyframes steam {

      50% { background-position: 100% 50%; }
